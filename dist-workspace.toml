[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app: a shell installer and a Homebrew formula
installers = ["shell", "homebrew"]
# The Homebrew tap the formula is published to (needs the HOMEBREW_TAP_TOKEN secret)
tap = "mokevnin/homebrew-tap"
publish-jobs = ["homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax). Windows is not built: the
# queue is tested on macOS and Linux only.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

# Build linux arm64 on a native runner
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
