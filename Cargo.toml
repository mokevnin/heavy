[package]
name = "heavy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A machine-wide counting semaphore for heavy commands: N slots shared by every checkout and agent on one machine"
license = "Apache-2.0"
repository = "https://github.com/mokevnin/heavy"
homepage = "https://github.com/mokevnin/heavy"
readme = "README.md"
keywords = ["semaphore", "lock", "queue", "cli", "build"]
categories = ["command-line-utilities", "concurrency"]

[lib]
name = "heavy"
path = "src/lib.rs"

[[bin]]
name = "heavy"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:libc"]

[dependencies]
clap = { version = "4", features = ["derive", "env"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
