name: release-please

# release-please opens the release pull request from the Conventional Commits on main and, when it
# is merged, tags the release. The tag starts release.yml (generated by dist), which builds the
# archives, publishes the GitHub release and the Homebrew formula and runs publish-crates.yml.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A tag or a pull request made with GITHUB_TOKEN starts no other workflow, so release-please
      # uses a token of its own: the tag then starts release.yml, and CI runs on the release pull request.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
